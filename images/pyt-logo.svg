<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 110" width="340" height="110">
  <defs>
    <style>
      .bg   { fill: #0d1117; }
      .border { fill: none; stroke: #21262d; stroke-width: 1.5; }
      .word { font-family: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code','Courier New',monospace;
              font-size: 60px; font-weight: 700; }
      .tag  { font-family: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code','Courier New',monospace;
              font-size: 11px; fill: #6e7681; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="340" height="110" rx="12"/>
  <rect class="border" width="340" height="110" rx="12"/>

  <!-- Wordmark: py (white) + t (red) in one text block so spacing is exact -->
  <text class="word" x="26" y="74">
    <tspan fill="#e6edf3">py</tspan><tspan fill="#ff1a1a">t</tspan>
  </text>

  <!-- Accent underline under the "t" only -->
  <!-- approximate x after "py" at ~26 + 2×36 = 98, width ~36 -->
  <rect x="98" y="79" width="34" height="3" rx="1.5" fill="#ff1a1a" opacity="0.85"/>

  <!-- Download arrow icon -->
  <g transform="translate(178, 20)" stroke="#ff1a1a" stroke-linecap="round"
     stroke-linejoin="round" fill="none" stroke-width="2.8">
    <line x1="14" y1="2"  x2="14" y2="38"/>
    <polyline points="5,29 14,40 23,29"/>
    <line x1="3"  y1="52" x2="25" y2="52"/>
  </g>

  <!-- Tagline -->
  <text class="tag" x="26" y="98">youtube downloader · python 3</text>
</svg>
