<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .word { font-family: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code','Courier New',monospace;
              font-size: 46px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#0d1117"/>
  <rect width="100" height="100" rx="18" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!-- "py" stacked above "t" layout won't fit — use centred "pyt" -->
  <text class="word" x="50" y="60" text-anchor="middle">
    <tspan fill="#e6edf3">py</tspan><tspan fill="#ff1a1a">t</tspan>
  </text>

  <!-- Red underline accent -->
  <rect x="26" y="66" width="48" height="3" rx="1.5" fill="#ff1a1a" opacity="0.7"/>

  <!-- Small download arrow below text -->
  <g transform="translate(50, 76)" stroke="#ff1a1a" stroke-linecap="round"
     stroke-linejoin="round" fill="none" stroke-width="2.2">
    <line x1="0" y1="0"  x2="0" y2="12"/>
    <polyline points="-6,7 0,14 6,7"/>
  </g>
</svg>
