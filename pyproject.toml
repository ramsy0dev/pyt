[tool.poetry]
name = "pyt"
version = "1.1.0"
description = "A maintained pytube fork for downloading YouTube videos."
authors = ["ramsy0dev <ramsy0dev@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/ramsy0dev/pyt"
repository = "https://github.com/ramsy0dev/pyt"
keywords = ["youtube", "download", "video", "pyt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
mutagen = ">=1.47.0"
browser-cookie3 = ">=0.20.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = ">=7.1.0,<8"
pytest-mock = "^3.15.1"
mypy = "^1.20.2"
black = ">=26.3.1,<27.0.0"
typing-extensions = "^4.15.0"

[tool.poetry.plugins."console_scripts"]
pyt = "pyt.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Legacy tests intentionally exercise the deprecated YouTube/Playlist/etc.
    # surface. Silence those warnings here so the suite stays readable; the
    # new-API tests in tests/test_api.py validate the modern path explicitly
    # via pytest.warns, which works regardless of this filter.
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
